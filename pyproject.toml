[project]
name = "repobrain"
version = "0.1.0"
description = "A company brain for open-source orgs, built on FalkorDB"
requires-python = ">=3.11"
dependencies = [
    "falkordb>=1.8",
    "httpx>=0.28",
    "python-dotenv>=1.0",
    "google-genai>=2.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["repobrain*"]
